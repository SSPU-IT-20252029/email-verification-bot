name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v4.1.7
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

    # actions/setup-go@v5.0.2
    - name: Set up Go
      uses: actions/setup-go@0a12ed9c6a96ab950c8f026ed9f722fe0da7ef32
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
